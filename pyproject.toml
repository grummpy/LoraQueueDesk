[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lora-queue-desk"
version = "0.1.0"
description = "Local desk for a ComfyUI LoRA queue, with a gaming lock that keeps the GPU free."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["comfyui", "lora", "queue", "cli"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lora-queue = "lora_queue_desk.cli:main"

[project.urls]
Homepage = "https://github.com/grummpy/LoraQueueDesk"
Repository = "https://github.com/grummpy/LoraQueueDesk"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lora_queue_desk = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
